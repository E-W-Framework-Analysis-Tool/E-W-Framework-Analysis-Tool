name: .NET CI

on:
  pull_request:
    paths:
      - 'src/**'
      - 'eng/build-solution.ps1'
      - 'eng/run-e2e.ps1'
      - 'eng/run-integration.ps1'
      - '**/*.sln'
      - '**/*.csproj'
      - '**/*.props'
      - '**/*.targets'
      - '.editorconfig'
  push:
    branches: [ main ]
    tags:
      - 'v*'

jobs:
  build:
    name: Build & Unit Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Build and test solution
        shell: pwsh
        run: |
          $checkFlag = if ("${{ github.event_name }}" -eq "pull_request") { "-Check" } else { "" }
          Invoke-Expression "./eng/build-solution.ps1 $checkFlag -Publish -Configuration Release"

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: build-output-${{ github.run_number }}
          path: publish/
          retention-days: 1  # Short-lived, just for downstream test jobs

  e2e-tests:
    name: E2E & Accessibility Tests
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: build-output-${{ github.run_number }}
          path: publish/

      - name: Run E2E and accessibility tests
        shell: pwsh
        run: |
          if ("${{ github.event_name }}" -eq "pull_request") {
            # PR: Fast smoke tests - Chrome only, critical A11y issues only
            ./eng/run-e2e.ps1 -Configuration Release -A11yFailLevel "critical"
          } else {
            # Main/Tags: Comprehensive tests - all browsers
            ./eng/run-e2e.ps1 -Configuration Release -AllBrowsers -A11yFailLevel "critical"
          }

      - name: Upload E2E test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-reports-${{ github.run_number }}
          path: publish/wwwroot/accessibility-reports/
          retention-days: ${{ github.event_name == 'pull_request' && '7' || '30' }}

  integration-tests:
    name: Integration Tests
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Run Integration tests
        shell: pwsh
        run: |
          ./eng/run-integration.ps1 -Configuration Release -BaseUrl "${{ vars.EWTEST_EDFI_BASE_URL }}" -ClientId "${{ vars.EWTEST_EDFI_CLIENT_ID }}" -ClientSecret "${{ vars.EWTEST_EDFI_CLIENT_SECRET }}" -AuthUrl "${{ vars.EWTEST_EDFI_AUTH_URL }}"

  prepare-deployment:
    name: Prepare Deployment
    runs-on: ubuntu-latest
    needs: [build, e2e-tests, integration-tests]
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
    outputs:
      version: ${{ steps.determine-version.outputs.version }}

    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: build-output-${{ github.run_number }}
          path: publish/

      - name: Determine version
        id: determine-version
        shell: pwsh
        run: |
          if ("${{ github.ref }}" -match "^refs/tags/v(.+)$") {
            $version = $matches[1]
          } else {
            $shortSha = "${{ github.sha }}".Substring(0, 7)
            $version = "main-$shortSha"
          }
          echo "version=$version" >> $env:GITHUB_OUTPUT
          echo "VERSION=$version" >> $env:GITHUB_ENV

      - name: Upload deployment artifacts
        uses: actions/upload-artifact@v4
        with:
          name: blazor-app-${{ env.VERSION }}
          path: publish/
          retention-days: 30

  trigger-deploy:
    name: Trigger Deployment
    runs-on: ubuntu-latest
    needs: prepare-deployment

    steps:
      - name: Dispatch deploy event to Infrastructure repo
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.INFRA_DISPATCH_TOKEN }}
          script: |
            await github.rest.repos.createDispatchEvent({
              owner: 'E-W-Framework-Analysis-Tool',
              repo: 'Infrastructure',
              event_type: 'ewfat-deploy',
              client_payload: {
                artifact_name: 'blazor-app-${{ needs.prepare-deployment.outputs.version }}',
                run_id: '${{ github.run_id }}',
                ref: '${{ github.ref }}',
                sha: '${{ github.sha }}',
                run_number: '${{ github.run_number }}',
                version: '${{ needs.prepare-deployment.outputs.version }}'
              }
            })
