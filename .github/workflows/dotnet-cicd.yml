name: .NET CI/CD

on:
  pull_request:
    paths:
      - 'src/**'
      - 'eng/build-solution.ps1'
      - 'eng/run-e2e.ps1'
      - 'eng/run-integration.ps1'
      - '**/*.sln'
      - '**/*.csproj'
      - '**/*.props'
      - '**/*.targets'
      - '.editorconfig'
  push:
    branches: [ main ]
    tags:
      - 'v*'

jobs:
  build:
    name: Build & Unit Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'

      - name: Build and test solution
        shell: pwsh
        run: |
          $checkFlag = if ("${{ github.event_name }}" -eq "pull_request") { "-Check" } else { "" }
          Invoke-Expression "./eng/build-solution.ps1 $checkFlag -Publish -Configuration Release"

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: build-output-${{ github.run_number }}
          path: publish/
          retention-days: 1  # Short-lived, just for E2E tests

  e2e-tests:
    name: E2E & Accessibility Tests
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'

      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: build-output-${{ github.run_number }}
          path: publish/

      - name: Run E2E and accessibility tests
        shell: pwsh
        run: |
          if ("${{ github.event_name }}" -eq "pull_request") {
            # PR: Fast smoke tests - Chrome only, critical A11y issues only
            ./eng/run-e2e.ps1 -Configuration Release -A11yFailLevel "critical"
          } else {
            # Main/Tags: Comprehensive tests - all browsers, serious A11y level
            ./eng/run-e2e.ps1 -Configuration Release -AllBrowsers -A11yFailLevel "critical"
          }

      - name: Upload E2E test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-reports-${{ github.run_number }}
          path: publish/wwwroot/accessibility-reports/
          retention-days: ${{ github.event_name == 'pull_request' && '7' || '30' }}

  integration-tests:
    name: Integration Tests
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'

      - name: Run Integration tests
        shell: pwsh
        run: |
          ./eng/run-integration.ps1 -Configuration Release -BaseUrl "${{ vars.EWTEST_EDFI_BASE_URL }}" -ClientId "${{ vars.EWETEST_EDFI_CLIENT_ID }}" -ClientSecret "${{ vars.EWTEST_EDFI_CLIENT_SECRET }}" -AuthUrl "${{ vars.EWTEST_EDFI_AUTH_URL }}"

  prepare-deployment:
    name: Prepare Deployment
    runs-on: ubuntu-latest
    needs: build
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))

    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: build-output-${{ github.run_number }}
          path: publish/

      - name: Determine version
        shell: pwsh
        run: |
          if ("${{ github.ref }}" -match "^refs/tags/v(.+)$") {
            $version = $matches[1]
          } else {
            $shortSha = "${{ github.sha }}".Substring(0, 7)
            $version = "main-$shortSha"
          }
          echo "VERSION=$version" >> $env:GITHUB_ENV

      - name: Upload deployment artifacts
        uses: actions/upload-artifact@v4
        with:
          name: blazor-app-${{ env.VERSION }}
          path: publish/
          retention-days: 30

  deploy-dev:
    name: Deploy to Dev Environment
    runs-on: ubuntu-latest
    needs: prepare-deployment
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
    environment: dev

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Determine version
        shell: pwsh
        run: |
          if ("${{ github.ref }}" -match "^refs/tags/v(.+)$") {
            $version = $matches[1]
          } else {
            $shortSha = "${{ github.sha }}".Substring(0, 7)
            $version = "main-$shortSha"
          }
          echo "VERSION=$version" >> $env:GITHUB_ENV

      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: blazor-app-${{ env.VERSION }}
          path: publish/

      - name: Transform appsettings.json for Dev
        uses: ./.github/actions/transform-config
        env:
          EWFTOOLSETTING__DeploymentInfo__Version: ${{ env.VERSION }}
          EWFTOOLSETTING__DeploymentInfo__DeployDateTime: ${{ github.event.head_commit.timestamp }}
          EWFTOOLSETTING__DeploymentInfo__EnvironmentLabel: ${{ vars.EWFTOOLSETTING__DeploymentInfo__EnvironmentLabel }}
          EWFTOOLSETTING__DeploymentInfo__ShowDetails: ${{ vars.EWFTOOLSETTING__DeploymentInfo__ShowDetails }}
          EWFTOOLSETTING__DeploymentInfo__GitCommit: ${{ github.sha }}
          EWFTOOLSETTING__DeploymentInfo__BuildNumber: ${{ github.run_number }}
          EWFTOOLSETTING__DemoEdFiApi__BaseUrl: ${{ vars.EWFTOOLSETTING__DemoEdFiApi__BaseUrl }}
          EWFTOOLSETTING__DemoEdFiApi__ClientId: ${{ vars.EWFTOOLSETTING__DemoEdFiApi__ClientId }}
          EWFTOOLSETTING__DemoEdFiApi__ClientSecret: ${{ vars.EWFTOOLSETTING__DemoEdFiApi__ClientSecret }}

      - name: Deploy to Azure Static Web Apps (Dev)
        shell: pwsh
        run: |
          ./eng/deploy-to-azure-swa.ps1 -DeployToken "${{ secrets.AZURE_SWA_DEPLOY_TOKEN }}" -AppLocation "publish/wwwroot"

  deploy-test:
    name: Deploy to Test Environment
    runs-on: ubuntu-latest
    needs: deploy-dev
    if: startsWith(github.ref, 'refs/tags/v') && false  # Re-enable when ready
    environment: test

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Extract version from tag
        shell: pwsh
        run: |
          $tagRef = "${{ github.ref }}"
          if ($tagRef -match "^refs/tags/v(.+)$") {
            $version = $matches[1]
          } else {
            Write-Error "Invalid tag format: $tagRef"
            exit 1
          }
          echo "VERSION=$version" >> $env:GITHUB_ENV

      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: blazor-app-${{ env.VERSION }}
          path: publish/

      - name: Transform appsettings.json for Test
        uses: ./.github/actions/transform-config
        env:
          EWFTOOLSETTING__DeploymentInfo__Version: ${{ env.VERSION }}
          EWFTOOLSETTING__DeploymentInfo__DeployDateTime: ${{ github.event.head_commit.timestamp }}
          EWFTOOLSETTING__DeploymentInfo__EnvironmentLabel: ${{ vars.EWFTOOLSETTING__DeploymentInfo__EnvironmentLabel }}
          EWFTOOLSETTING__DeploymentInfo__ShowDetails: ${{ vars.EWFTOOLSETTING__DeploymentInfo__ShowDetails }}
          EWFTOOLSETTING__DeploymentInfo__GitCommit: ${{ github.sha }}
          EWFTOOLSETTING__DeploymentInfo__BuildNumber: ${{ github.run_number }}
          EWFTOOLSETTING__DemoEdFiApi__BaseUrl: ${{ vars.EWFTOOLSETTING__DemoEdFiApi__BaseUrl }}
          EWFTOOLSETTING__DemoEdFiApi__ClientId: ${{ vars.EWFTOOLSETTING__DemoEdFiApi__ClientId }}
          EWFTOOLSETTING__DemoEdFiApi__ClientSecret: ${{ vars.EWFTOOLSETTING__DemoEdFiApi__ClientSecret }}

      - name: Deploy to Azure Static Web Apps (Test)
        shell: pwsh
        run: |
          ./eng/deploy-to-azure-swa.ps1 -DeployToken "${{ secrets.AZURE_SWA_DEPLOY_TOKEN }}" -AppLocation "publish/wwwroot"

  deploy-prod:
    name: Deploy to Production Environment
    runs-on: ubuntu-latest
    needs: [deploy-test, e2e-tests, integration-tests]
    if: startsWith(github.ref, 'refs/tags/v') && false  # Re-enable when ready
    environment: production

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Extract version from tag
        shell: pwsh
        run: |
          $tagRef = "${{ github.ref }}"
          if ($tagRef -match "^refs/tags/v(.+)$") {
            $version = $matches[1]
          } else {
            Write-Error "Invalid tag format: $tagRef"
            exit 1
          }
          echo "VERSION=$version" >> $env:GITHUB_ENV

      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: blazor-app-${{ env.VERSION }}
          path: publish/

      - name: Transform appsettings.json for Production
        uses: ./.github/actions/transform-config
        env:
          EWFTOOLSETTING__DeploymentInfo__Version: ${{ env.VERSION }}
          EWFTOOLSETTING__DeploymentInfo__DeployDateTime: ${{ github.event.head_commit.timestamp }}
          EWFTOOLSETTING__DeploymentInfo__EnvironmentLabel: ${{ vars.EWFTOOLSETTING__DeploymentInfo__EnvironmentLabel }}
          EWFTOOLSETTING__DeploymentInfo__ShowDetails: ${{ vars.EWFTOOLSETTING__DeploymentInfo__ShowDetails }}
          EWFTOOLSETTING__DeploymentInfo__GitCommit: ${{ github.sha }}
          EWFTOOLSETTING__DeploymentInfo__BuildNumber: ${{ github.run_number }}
          EWFTOOLSETTING__DemoEdFiApi__BaseUrl: ${{ vars.EWFTOOLSETTING__DemoEdFiApi__BaseUrl }}
          EWFTOOLSETTING__DemoEdFiApi__ClientId: ${{ vars.EWFTOOLSETTING__DemoEdFiApi__ClientId }}
          EWFTOOLSETTING__DemoEdFiApi__ClientSecret: ${{ vars.EWFTOOLSETTING__DemoEdFiApi__ClientSecret }}

      - name: Deploy to Azure Static Web Apps (Production)
        shell: pwsh
        run: |
          ./eng/deploy-to-azure-swa.ps1 -DeployToken "${{ secrets.AZURE_SWA_DEPLOY_TOKEN }}" -AppLocation "publish/wwwroot"