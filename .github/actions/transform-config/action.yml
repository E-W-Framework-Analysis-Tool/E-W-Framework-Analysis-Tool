# .github/actions/transform-config/action.yml
name: 'Transform Config'
description: 'Transform appsettings.json with environment variables'
inputs:
  appsettings-path:
    description: 'Path to appsettings.json file'
    required: false
    default: 'publish/wwwroot/appsettings.json'
runs:
  using: 'composite'
  steps:
    - name: Transform appsettings.json
      shell: pwsh
      run: |
        $appsettingsPath = "${{ inputs.appsettings-path }}"
        
        if (-not (Test-Path $appsettingsPath)) {
            Write-Error "appsettings.json not found at: $appsettingsPath"
            exit 1
        }
        
        Write-Host "Transforming appsettings.json using environment variables with prefix: EWFTOOLSETTING__"
        
        try {
            # Read and parse JSON
            $content = Get-Content $appsettingsPath -Raw | ConvertFrom-Json
            
            # Process environment variables that start with EWFTOOLSETTING__
            $envVars = Get-ChildItem Env: | Where-Object { $_.Name -like "EWFTOOLSETTING__*" }
            
            if ($envVars.Count -eq 0) {
                Write-Host "No EWFTOOLSETTING__* environment variables found"
            } else {
                Write-Host "Processing $($envVars.Count) environment variable(s):"
                
                foreach ($envVar in $envVars) {
                    # Remove prefix and convert double underscores to dots for JSON path
                    $jsonPath = $envVar.Name.Substring(15) -replace '__', '.'
                    $value = $envVar.Value
                    
                    # Convert string values to appropriate types
                    if ($value -eq "true") { $value = $true }
                    elseif ($value -eq "false") { $value = $false }
                    elseif ($value -match '^\d+$') { $value = [int]$value }
                    elseif ($value -match '^\d+\.\d+$') { $value = [double]$value }
                    
                    # Navigate and set the property
                    $parts = $jsonPath -split '\.'
                    $current = $content
                    
                    # Navigate to the parent object, creating nested objects as needed
                    for ($i = 0; $i -lt ($parts.Length - 1); $i++) {
                        $part = $parts[$i]
                        if (-not $current.$part) {
                            $current | Add-Member -MemberType NoteProperty -Name $part -Value @{}
                        }
                        $current = $current.$part
                    }
                    
                    # Set the final property
                    $finalProp = $parts[-1]
                    if ($current.$finalProp) {
                        $current.$finalProp = $value
                    } else {
                        $current | Add-Member -MemberType NoteProperty -Name $finalProp -Value $value
                    }
                    
                    Write-Host "  Set $jsonPath = $($envVar.Value)"
                }
            }
            
            # Write back to file with proper formatting
            $content | ConvertTo-Json -Depth 10 | Set-Content $appsettingsPath -Encoding UTF8
            
            Write-Host "Successfully updated appsettings.json" -ForegroundColor Green
            
        } catch {
            Write-Error "Failed to transform appsettings.json: $($_.Exception.Message)"
            exit 1
        }