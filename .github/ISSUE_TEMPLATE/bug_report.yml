name: Bug Report
description: Report something that isn't working correctly
title: "[Bug] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report a bug! Please fill out the sections below.

  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: A clear description of the bug.
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: How can we reproduce the issue?
      placeholder: |
        1. Go to '...'
        2. Click on '...'
        3. See error
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
      description: What did you expect to happen?
    validations:
      required: true

  - type: textarea
    id: screenshots
    attributes:
      label: Screenshots or console output
      description: If applicable, paste any browser console errors or add screenshots.

  - type: input
    id: browser
    attributes:
      label: Browser and version
      placeholder: e.g. Chrome 124

  - type: input
    id: os
    attributes:
      label: Operating system
      placeholder: e.g. Windows 11, macOS 14

  - type: input
    id: version
    attributes:
      label: Application version or commit
      placeholder: e.g. v1.2.0 or a commit SHA, if known

  - type: textarea
    id: context
    attributes:
      label: Additional context
      description: Anything else that might be relevant.
