
name: Feature Request
description: Suggest an idea or improvement
title: "[Feature] "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Have an idea? We'd love to hear it. Please describe the problem you're trying to solve, not just the solution — it helps us understand the use case.

  - type: textarea
    id: problem
    attributes:
      label: What problem does this solve?
      description: Describe the gap or use case this would address.
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: Describe the solution you'd like
      description: What would you like to see added or changed?
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives you've considered
      description: Any other approaches you've thought about, and why you prefer this one.

  - type: textarea
    id: context
    attributes:
      label: Additional context
      description: Screenshots, mockups, links to E-W Framework documentation, or related issues.
