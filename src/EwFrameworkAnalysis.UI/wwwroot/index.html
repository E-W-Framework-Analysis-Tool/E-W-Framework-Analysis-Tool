<!DOCTYPE html>
<html lang="en" data-theme="ewframework">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- Primary meta -->
    <title>E-W Framework Analysis Tool</title>
    <meta name="description" content="Open-source tool for education agencies to operationalize the Education-to-Workforce Indicator Framework. Assess your data landscape across systems and sectors, build a roadmap from framework adoption to action, and see your data come to life through embedded dashboards." />
    <meta name="keywords" content="Education-to-Workforce, E-W Framework, education data, SLDS, Ed-Fi, CEDS, P20W, data readiness, indicator framework, state education agency" />
    <meta name="robots" content="index, follow" />
    <link rel="canonical" href="https://www.ewfanalysistool.com/" />

    <!-- Open Graph (link previews in Slack, LinkedIn, etc.) -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://www.ewfanalysistool.com/" />
    <meta property="og:title" content="E-W Framework Analysis Tool" />
    <meta property="og:description" content="Open-source tool for education agencies to operationalize the Education-to-Workforce Indicator Framework. Assess your data landscape across systems and sectors, build a roadmap from framework adoption to action, and see your data come to life through embedded dashboards." />
    <meta property="og:image" content="https://www.ewfanalysistool.com/images/og-preview.jpg" />
    <!-- Twitter/X card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:url" content="https://www.ewfanalysistool.com/" />
    <meta name="twitter:title" content="E-W Framework Analysis Tool" />
    <meta name="twitter:description" content="Open-source tool for education agencies to operationalize the Education-to-Workforce Indicator Framework. Assess your data landscape across systems and sectors, build a roadmap from framework adoption to action, and see your data come to life through embedded dashboards." />
    <meta name="twitter:image" content="https://www.ewfanalysistool.com/images/og-preview.jpg" />
    <!-- Structured data (Google rich results) -->
    <script type="application/ld+json">
        {
          "@context": "https://schema.org",
          "@type": "SoftwareApplication",
          "name": "E-W Framework Analysis Tool",
          "url": "https://www.ewfanalysistool.com/",
          "description": "Open-source tool for education agencies to operationalize the Education-to-Workforce Indicator Framework. Assess your data landscape across systems and sectors, build a roadmap from framework adoption to action, and see your data come to life through embedded dashboards.",
          "applicationCategory": "EducationalApplication",
          "operatingSystem": "Web",
          "offers": {
            "@type": "Offer",
            "price": "0",
            "priceCurrency": "USD"
          },
          "codeRepository": "https://github.com/E-W-Framework-Analysis-Tool/E-W-Framework-Analysis-Tool"
        }
    </script>

    <base href="/" />
    <link rel="stylesheet" href="css/app.css" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css">
</head>
<body>
    <div id="blazor-loading">
        <div class="ew-loading-indicator ew-animate">
            <div class="ew-top ew-dur"></div>
            <div class="ew-row">
                <div class="ew-block ew-b1 ew-dur"></div>
                <div class="ew-block ew-b2 ew-dur"></div>
                <div class="ew-block ew-b3 ew-dur"></div>
                <div class="ew-block ew-b4 ew-dur"></div>
            </div>
        </div>
        <div class="loading-wordmark">E-W Framework <span>Analysis Tool</span></div>
    </div>

    <div id="app"></div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.8.2/jspdf.plugin.autotable.min.js"></script>
    <script src="js/pdf-report.js"></script>
    <script src="js/walkthrough.js"></script>
    <script src="js/scroll.js"></script>
    <script src="_framework/blazor.webassembly.js" autostart="false"></script>
    <script>
        requestAnimationFrame(() => requestAnimationFrame(() => {
            Blazor.start().then(() => {
                const loader = document.getElementById('blazor-loading');
                if (loader) {
                    loader.classList.add('fade-out');
                    loader.addEventListener('transitionend', () => loader.remove(), { once: true });
                }
            });
        }));
    </script>
</body>
</html>
